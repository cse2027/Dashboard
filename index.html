<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Resource Dashboard</h1>
      <button class="btn btn-primary" id="openAddModalBtn">+ Add Link</button>
    </header>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search links...">
    </div>

    <!-- Small Cards Grid (4-5 per row on desktop, responsive) -->
    <div class="cards-grid" id="cardsGrid">
      <!-- Rendered dynamically by app.js -->
    </div>
  </div>

  <!-- Modal: Add New Link -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-title">
        <span>Add New Link</span>
        <button class="btn-close" id="closeAddBtn">&times;</button>
      </div>
      <form id="addLinkForm">
        <div class="form-group">
          <label for="linkTitle">Link Name *</label>
          <input type="text" id="linkTitle" class="form-control" placeholder="e.g. SEMESTER SYLLABUS" required>
        </div>
        <div class="form-group">
          <label for="linkUrl">URL *</label>
          <input type="url" id="linkUrl" class="form-control" placeholder="https://..." required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelAddBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitAddBtn">Save Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
